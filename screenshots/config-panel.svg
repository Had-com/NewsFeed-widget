  <circle cx="40" cy="514" r="7" fill="#c0392b"/>
  <circle cx="58" cy="514" r="7" fill="#2980b9"/>
  <circle cx="76" cy="514" r="7" fill="#27ae60"/>
  <circle cx="94" cy="514" r="7" fill="#8e44ad"/>
  <circle cx="112" cy="514" r="7" fill="#e67e22"/>
  <circle cx="130" cy="514" r="7" fill="#1abc9c" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="148" y="504" width="64" height="20" rx="5" ry="5" fill="#f5f5f5" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="180" y="518" fill="#666" font-size="11" text-anchor="middle">Default ▾</text>
  <rect x="220" y="504" width="26" height="20" rx="4" fill="#f5f5f5" stroke="#ddd" stroke-width="0.5"/>
  <text x="233" y="518" fill="#999" font-size="12" text-anchor="middle" font-weight="bold">B</text>
  <rect x="250" y="504" width="26" height="20" rx="4" fill="#f5f5f5" stroke="#ddd" stroke-width="0.5"/>
  <text x="263" y="518" fill="#999" font-size="12" text-anchor="middle" font-style="italic">I</text>
  <rect x="280" y="504" width="26" height="20" rx="4" fill="#f5f5f5" stroke="#ddd" stroke-width="0.5"/>
  <text x="293" y="518" fill="#999" font-size="12" text-anchor="middle" text-decoration="underline">U</text>

  <line x1="0" y1="536" x2="360" y2="536" stroke="#ececec" stroke-width="0.5"/>


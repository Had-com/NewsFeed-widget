  <circle cx="76" cy="446" r="7" fill="#27ae60"/>
  <circle cx="94" cy="446" r="7" fill="#8e44ad" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="112" cy="446" r="7" fill="#e67e22"/>

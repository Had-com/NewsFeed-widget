<svg viewBox="0 0 280 480" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,sans-serif">
  <!-- Panel background -->
  <rect width="280" height="480" rx="16" fill="#FFFFFF"/>

  <!-- Top bar -->
  <rect width="280" height="52" rx="0" fill="#F6F0FB"/>
  <rect width="280" height="52" rx="16" fill="#F6F0FB"/>
  <rect x="0" y="36" width="280" height="16" fill="#F6F0FB"/>
  <text x="16" y="32" font-size="16" font-weight="700" fill="#1C1B1F">Widget Settings</text>
  <rect x="0" y="52" width="280" height="1" fill="#E0D8F0"/>

  <!-- Section: Sort -->
  <text x="16" y="74" font-size="10" font-weight="600" fill="#49454F" letter-spacing="0.08">SORT &amp; FILTER</text>
  <text x="16" y="96" font-size="12" fill="#1C1B1F">Sort order</text>
  <rect x="172" y="82" width="92" height="24" rx="6" fill="#F6F0FB"/>
  <text x="218" y="98" font-size="11" fill="#9B72E3" text-anchor="middle">Newest first ▾</text>

  <text x="16" y="122" font-size="12" fill="#1C1B1F">Filter</text>
  <rect x="172" y="108" width="92" height="24" rx="6" fill="#F6F0FB"/>
  <text x="218" y="124" font-size="11" fill="#9B72E3" text-anchor="middle">All ▾</text>

  <text x="16" y="148" font-size="12" fill="#1C1B1F">Widget theme</text>
  <rect x="172" y="134" width="92" height="24" rx="6" fill="#F6F0FB"/>
  <text x="218" y="150" font-size="11" fill="#9B72E3" text-anchor="middle">Amethyst ▾</text>

  <text x="16" y="174" font-size="12" fill="#1C1B1F">Theme variant</text>
  <!-- Light button -->
  <rect x="172" y="160" width="42" height="24" rx="6" fill="#F6F0FB"/>
  <text x="193" y="176" font-size="11" fill="#49454F" text-anchor="middle">Light</text>
  <!-- Dark button (selected) -->
  <rect x="218" y="160" width="42" height="24" rx="6" fill="#E0D8F0"/>
  <text x="239" y="176" font-size="11" fill="#9B72E3" text-anchor="middle">Dark</text>

  <rect x="0" y="192" width="280" height="1" fill="#E0D8F0"/>

  <!-- Section: Feeds -->
  <text x="16" y="212" font-size="10" font-weight="600" fill="#49454F" letter-spacing="0.08">FEEDS</text>

  <!-- Feed row 1 -->
  <text x="16" y="232" font-size="18" fill="#9B72E3">⠿</text>
  <circle cx="46" cy="228" r="9" fill="#9B72E3"/>
  <text x="46" y="231.5" font-size="8" font-weight="700" fill="#fff" text-anchor="middle">י</text>
  <text x="60" y="232" font-size="12" fill="#1C1B1F">ynet - מבזקים</text>
  <text x="262" y="232" font-size="14" fill="#CAC4D0" text-anchor="end">×</text>
  <!-- controls -->
  <rect x="16" y="240" width="14" height="14" rx="3" fill="#9B72E3"/>
  <text x="44" y="252" font-size="10" fill="#49454F">Serif</text>
  <text x="82" y="252" font-size="10" font-weight="700" fill="#49454F">B</text>
  <text x="96" y="252" font-size="10" font-style="italic" fill="#CAC4D0">I</text>
  <text x="110" y="252" font-size="10" fill="#CAC4D0" text-decoration="underline">U</text>
  <rect x="128" y="242" width="32" height="12" rx="6" fill="#E0D8F0"/>
  <text x="144" y="251.5" font-size="8" fill="#9B72E3" text-anchor="middle">RTL</text>
  <rect x="168" y="242" width="32" height="12" rx="6" fill="#F6F0FB"/>
  <text x="184" y="251.5" font-size="8" fill="#49454F" text-anchor="middle">IMG</text>
  <rect x="0" y="260" width="280" height="0.5" fill="#E0D8F0" opacity="0.6"/>

  <!-- Feed row 2 -->
  <text x="16" y="280" font-size="18" fill="#9B72E3">⠿</text>
  <circle cx="46" cy="276" r="9" fill="#E35272"/>
  <text x="46" y="279.5" font-size="8" font-weight="700" fill="#fff" text-anchor="middle">R</text>
  <text x="60" y="280" font-size="12" fill="#1C1B1F">Reuters</text>
  <text x="262" y="280" font-size="14" fill="#CAC4D0" text-anchor="end">×</text>
  <rect x="16" y="288" width="14" height="14" rx="3" fill="#E35272"/>
  <text x="44" y="300" font-size="10" fill="#49454F">Sans</text>
  <text x="82" y="300" font-size="10" font-weight="700" fill="#CAC4D0">B</text>
  <text x="96" y="300" font-size="10" font-style="italic" fill="#CAC4D0">I</text>
  <text x="110" y="300" font-size="10" fill="#CAC4D0">U</text>
  <rect x="128" y="290" width="32" height="12" rx="6" fill="#F6F0FB"/>
  <text x="144" y="299.5" font-size="8" fill="#49454F" text-anchor="middle">LTR</text>
  <rect x="168" y="290" width="32" height="12" rx="6" fill="#E0D8F0"/>
  <text x="184" y="299.5" font-size="8" fill="#9B72E3" text-anchor="middle">IMG</text>
  <rect x="0" y="308" width="280" height="0.5" fill="#E0D8F0" opacity="0.6"/>

  <!-- Feed row 3 -->
  <text x="16" y="328" font-size="18" fill="#9B72E3">⠿</text>
  <circle cx="46" cy="324" r="9" fill="#2E9EE3"/>
  <text x="46" y="327.5" font-size="8" font-weight="700" fill="#fff" text-anchor="middle">כ</text>
  <text x="60" y="328" font-size="12" fill="#1C1B1F">כאן חדשות</text>
  <text x="262" y="328" font-size="14" fill="#CAC4D0" text-anchor="end">×</text>
  <rect x="16" y="336" width="14" height="14" rx="3" fill="#2E9EE3"/>
  <text x="44" y="348" font-size="10" fill="#49454F">Sans</text>
  <text x="82" y="348" font-size="10" font-weight="700" fill="#49454F">B</text>
  <text x="96" y="348" font-size="10" font-style="italic" fill="#CAC4D0">I</text>
  <text x="110" y="348" font-size="10" fill="#CAC4D0">U</text>
  <rect x="128" y="338" width="32" height="12" rx="6" fill="#E0D8F0"/>
  <text x="144" y="347.5" font-size="8" fill="#9B72E3" text-anchor="middle">RTL</text>
  <rect x="168" y="338" width="32" height="12" rx="6" fill="#F6F0FB"/>
  <text x="184" y="347.5" font-size="8" fill="#49454F" text-anchor="middle">TXT</text>
  <rect x="0" y="356" width="280" height="1" fill="#E0D8F0"/>

  <!-- Add feed row -->
  <text x="16" y="376" font-size="10" font-weight="600" fill="#49454F" letter-spacing="0.08">ADD FEED</text>
  <rect x="16" y="384" width="192" height="28" rx="6" fill="#F6F0FB" stroke="#E0D8F0" stroke-width="1"/>
  <text x="26" y="401" font-size="11" fill="#CAC4D0">https://example.com/feed.xml</text>
  <rect x="216" y="384" width="48" height="28" rx="6" fill="#9B72E3"/>
  <text x="240" y="401" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">Add</text>

  <!-- Import / Export -->
  <rect x="16" y="424" width="114" height="28" rx="6" fill="#F6F0FB" stroke="#E0D8F0" stroke-width="1"/>
  <text x="73" y="441" font-size="11" fill="#9B72E3" text-anchor="middle">Import OPML</text>
  <rect x="150" y="424" width="114" height="28" rx="6" fill="#F6F0FB" stroke="#E0D8F0" stroke-width="1"/>
  <text x="207" y="441" font-size="11" fill="#9B72E3" text-anchor="middle">Export OPML</text>

  <!-- Save button -->
  <rect x="16" y="462" width="248" height="28" rx="8" fill="#9B72E3"/>
  <text x="140" y="479.5" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Save</text>
</svg>

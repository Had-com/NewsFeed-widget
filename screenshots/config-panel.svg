  <text x="285" y="129" fill="#1a1a1a" font-size="12" text-anchor="middle">Unread only ▾</text>

  <line x1="20" y1="146" x2="340" y2="146" stroke="#ececec" stroke-width="0.5"/>

  <!-- Feed order section header -->

  <text x="20" y="578" fill="#6750A4" font-size="10">⠿ Drag</text>
  <text x="80" y="578" fill="#888" font-size="10">● Accent color</text>
  <text x="190" y="578" fill="#888" font-size="10">B/I/U Text style</text>
  <text x="290" y="578" fill="#888" font-size="10">RTL/LTR Dir</text>

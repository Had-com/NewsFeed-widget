<svg viewBox="0 0 360 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <!-- Panel background -->
  <rect x="0" y="0" width="360" height="620" rx="16" ry="16" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Header -->
  <rect x="0" y="0" width="360" height="56" rx="16" ry="16" fill="#ffffff"/>
  <rect x="0" y="40" width="360" height="16" fill="#ffffff"/>
  <text x="20" y="34" fill="#1a1a1a" font-size="16" font-weight="500">Widget settings</text>
  <rect x="298" y="18" width="44" height="22" rx="8" ry="8" fill="#EDE9FE"/>
  <text x="320" y="33" fill="#6750A4" font-size="12" text-anchor="middle">Save</text>
  <line x1="0" y1="56" x2="360" y2="56" stroke="#ececec" stroke-width="0.5"/>

  <!-- Sort & Filter section -->
  <text x="20" y="76" fill="#aaa" font-size="10" letter-spacing="0.5">SORT &amp; FILTER</text>

  <!-- Sort row -->

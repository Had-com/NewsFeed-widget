  <rect x="250" y="228" width="26" height="20" rx="4" fill="#f5f5f5" stroke="#ddd" stroke-width="0.5"/>
  <text x="263" y="242" fill="#999" font-size="12" text-anchor="middle" font-style="italic">I</text>

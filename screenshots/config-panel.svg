  <text x="312" y="213" fill="#6750A4" font-size="10" text-anchor="middle">RTL ✓</text>
  <!-- color dots -->
  <circle cx="40" cy="238" r="7" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="58" cy="238" r="7" fill="#2980b9"/>
  <circle cx="76" cy="238" r="7" fill="#27ae60"/>
  <circle cx="94" cy="238" r="7" fill="#8e44ad"/>
  <circle cx="112" cy="238" r="7" fill="#e67e22"/>
  <circle cx="130" cy="238" r="7" fill="#9B72E3"/>

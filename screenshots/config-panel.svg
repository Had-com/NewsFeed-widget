  <rect x="280" y="436" width="26" height="20" rx="4" fill="#ede9fe" stroke="#6750A4" stroke-width="0.5"/>
  <text x="293" y="450" fill="#6750A4" font-size="12" text-anchor="middle" text-decoration="underline">U</text>


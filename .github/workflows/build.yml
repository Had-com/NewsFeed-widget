name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | grep -oP '"\K[^"]+')
          BUILD=$(grep 'versionCode' app/build.gradle.kts | head -1 | grep -oP '\d+')
          mkdir -p app/build/outputs/apk/renamed
          for f in app/build/outputs/apk/*/debug/*.apk; do
            flavor=$(echo "$f" | sed -E 's#app/build/outputs/apk/([^/]+)/debug/.*#\1#')
            cp "$f" "app/build/outputs/apk/renamed/NewsFeed-${flavor}-v${VERSION}-${BUILD}-run${{ github.run_number }}.apk"
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NewsFeed-v${{ github.run_number }}
          path: app/build/outputs/apk/renamed/*.apk
          retention-days: 30
